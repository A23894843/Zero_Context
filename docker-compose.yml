services:
  mysql:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${ZC_DB_PASS:-change_me}
      MYSQL_DATABASE: ${ZC_DB_NAME:-ZeroContext}
    volumes:
      - mysql_data:/var/lib/mysql
      - ./sql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 10

  dashboard:
    build: .
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      ZC_DB_HOST: mysql
      ZC_DB_USER: root
      ZC_DB_PASS: ${ZC_DB_PASS:-change_me}
      ZC_DB_NAME: ${ZC_DB_NAME:-ZeroContext}
      ZC_DASHBOARD_PORT: 8000
      ZC_DASHBOARD_API_KEY: ${ZC_DASHBOARD_API_KEY:?set ZC_DASHBOARD_API_KEY in .env}
    ports:
      - "8000:8000"
    volumes:
      - ./temporary:/app/temporary
      - ./models:/app/models

  # The Python intelligence engine (main.py) is intentionally NOT
  # containerized here: it launches the C++ sensor daemon with sudo and
  # needs direct access to /dev/input, which containers can't do safely.
  # Run it on the host: `python main.py`

volumes:
  mysql_data:
