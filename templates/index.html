<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>ZeroContext | SOC Dashboard</title>

    <style>
        /* =========================
           THEME VARIABLES
        ========================== */

        :root {
            --bg: #0d1117;
            --card: #161b22;
            --card-hover: #1c2128;
            --header: #21262d;
            --border: #30363d;
            --text: #c9d1d9;
            --muted: #8b949e;
            --primary: #58a6ff;
            --success: #238636;
            --success-glow: #2ea043;
            --danger: #f85149;
            --warning: #d29922;
            --mouse: #ff7b72;
            --kbd: #f2cc60;
            --shadow: rgba(0, 0, 0, 0.35);
        }

        /* LIGHT THEME */

        body.light {
            --bg: #f5f7fa;
            --card: #ffffff;
            --card-hover: #f1f5f9;
            --header: #e9eef5;
            --border: #d0d7de;
            --text: #24292f;
            --muted: #57606a;
            --primary: #0969da;
            --success: #1a7f37;
            --success-glow: #2da44e;
            --danger: #cf222e;
            --warning: #9a6700;
            --mouse: #cf222e;
            --kbd: #9a6700;
            --shadow: rgba(0, 0, 0, 0.12);
        }

        /* =========================
           GLOBAL
        ========================== */

        * {
            box-sizing: border-box;
        }

        body {
            background: var(--bg);
            color: var(--text);
            font-family: 'Courier New', Courier, monospace;
            margin: 0;
            padding: 20px;

            transition:
                background-color 0.3s ease,
                color 0.3s ease;
        }

        .dashboard-container {
            max-width: 1250px;
            margin: auto;
        }

        /* =========================
           HEADER
        ========================== */

        .topbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 20px;
            margin-bottom: 25px;
            border-bottom: 1px solid var(--border);
            padding-bottom: 15px;
        }

        .title-section h1 {
            color: var(--primary);
            margin: 0;
            font-size: 25px;
        }

        .subtitle {
            color: var(--muted);
            font-size: 12px;
            margin-top: 7px;
        }

        /* =========================
           STATUS
        ========================== */

        .status {
            display: flex;
            align-items: center;
            color: var(--success);
            font-size: 12px;
            margin-top: 7px;
        }

        .status-indicator {
            display: inline-block;
            width: 10px;
            height: 10px;

            background-color: var(--success);
            border-radius: 50%;

            margin-right: 8px;

            box-shadow:
                0 0 6px var(--success-glow),
                0 0 12px var(--success-glow);

            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0% {
                opacity: 1;
            }

            50% {
                opacity: 0.35;
            }

            100% {
                opacity: 1;
            }
        }

        /* =========================
           THEME BUTTON
        ========================== */

        #themeToggle {
            border: 1px solid var(--border);
            background: var(--card);
            color: var(--text);

            padding: 10px 16px;
            border-radius: 8px;

            font-family: inherit;
            font-size: 13px;

            cursor: pointer;

            transition:
                background 0.2s ease,
                transform 0.2s ease,
                border-color 0.2s ease;
        }

        #themeToggle:hover {
            background: var(--card-hover);
            border-color: var(--primary);
            transform: translateY(-2px);
        }

        /* =========================
           SUMMARY CARDS
        ========================== */

        .stats {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
            margin-bottom: 25px;
        }

        .stat-card {
            background: var(--card);
            border: 1px solid var(--border);

            padding: 18px;
            border-radius: 10px;

            box-shadow: 0 5px 20px var(--shadow);

            transition:
                transform 0.2s ease,
                background 0.3s ease;
        }

        .stat-card:hover {
            transform: translateY(-3px);
            background: var(--card-hover);
        }

        .stat-title {
            color: var(--muted);
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .stat-value {
            font-size: 28px;
            margin-top: 8px;
            color: var(--primary);
            font-weight: bold;
        }

        .stat-danger {
            color: var(--danger);
        }

        .stat-warning {
            color: var(--warning);
        }

        /* =========================
           TABLE CONTAINER
        ========================== */

        .table-container {
            background: var(--card);

            border: 1px solid var(--border);
            border-radius: 10px;

            overflow-x: auto;

            box-shadow:
                0 10px 30px var(--shadow);
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th,
        td {
            padding: 15px;
            text-align: left;
            border-bottom: 1px solid var(--border);
        }

        th {
            background: var(--header);
            color: var(--muted);

            text-transform: uppercase;
            letter-spacing: 0.1em;

            font-size: 12px;
        }

        td {
            font-size: 13px;
        }

        tbody tr {
            transition: background 0.2s ease;
        }

        tbody tr:hover {
            background: var(--card-hover);
        }

        tbody tr:last-child td {
            border-bottom: none;
        }

        /* =========================
           SENSOR COLORS
        ========================== */

        .sensor-kbd {
            color: var(--kbd);
            font-weight: bold;
        }

        .sensor-mouse {
            color: var(--mouse);
            font-weight: bold;
        }

        .score-high {
            color: var(--danger);
            font-weight: bold;
        }

        .score-med {
            color: var(--warning);
            font-weight: bold;
        }

        /* =========================
           BADGES
        ========================== */

        .badge {
            display: inline-block;

            padding: 4px 8px;

            border-radius: 5px;

            font-size: 10px;
            font-weight: bold;

            background: var(--header);
            border: 1px solid var(--border);
        }

        /* =========================
           FOOTER
        ========================== */

        .footer {
            display: flex;
            justify-content: space-between;

            margin-top: 15px;

            color: var(--muted);
            font-size: 11px;
        }

        /* =========================
           RESPONSIVE
        ========================== */

        @media (max-width: 800px) {

            .stats {
                grid-template-columns: 1fr;
            }

            .topbar {
                flex-direction: column;
                align-items: flex-start;
            }

            #themeToggle {
                width: 100%;
            }

            body {
                padding: 10px;
            }

            th,
            td {
                padding: 10px;
            }
        }
    </style>
</head>

<body>

<div class="dashboard-container">

    <!-- HEADER -->

    <div class="topbar">

        <div class="title-section">

            <h1>
                <span class="status-indicator"></span>
                ZeroContext IDPS
            </h1>

            <div class="subtitle">
                Intelligent Threat Detection & Behavioral Telemetry
            </div>

            <div class="status">
                SYSTEM ONLINE • LIVE TELEMETRY
            </div>

        </div>

        <!-- THEME BUTTON -->

        <button id="themeToggle">
            ☀️ Light Mode
        </button>

    </div>


    <!-- SUMMARY -->

    <div class="stats">

        <div class="stat-card">
            <div class="stat-title">
                Total Alerts
            </div>

            <div
                class="stat-value"
                id="totalAlerts">
                0
            </div>
        </div>


        <div class="stat-card">

            <div class="stat-title">
                High Risk
            </div>

            <div
                class="stat-value stat-danger"
                id="highRisk">
                0
            </div>

        </div>


        <div class="stat-card">

            <div class="stat-title">
                Last Update
            </div>

            <div
                class="stat-value stat-warning"
                id="lastUpdate"
                style="font-size:18px;">
                --
            </div>

        </div>

    </div>


    <!-- ALERT TABLE -->

    <div class="table-container">

        <table>

            <thead>

                <tr>
                    <th>Alert ID</th>
                    <th>Timestamp</th>
                    <th>Sensor Vector</th>
                    <th>Anomaly Score</th>
                    <th>Description</th>
                </tr>

            </thead>

            <tbody id="alert-table-body">

                <tr>
                    <td colspan="5" style="text-align:center;">
                        Waiting for telemetry...
                    </td>
                </tr>

            </tbody>

        </table>

    </div>


    <!-- FOOTER -->

    <div class="footer">

        <span>
            ZeroContext Security Engine
        </span>

        <span>
            Refresh: 1.5s
        </span>

    </div>

</div>


<script>

    /* =========================
       AUTH
       Injected server-side by dashboard.py's Jinja2 template so the key
       lives in .env, not in this static file.
    ========================== */

    const ZC_API_KEY = "{{ zc_api_key }}";

    /* =========================
       THEME MANAGEMENT
    ========================== */

    const themeButton =
        document.getElementById("themeToggle");

    function updateThemeButton() {

        if (document.body.classList.contains("light")) {

            themeButton.innerHTML =
                "🌙 Dark Mode";

        } else {

            themeButton.innerHTML =
                "☀️ Light Mode";
        }
    }


    // Load saved theme

    const savedTheme =
        localStorage.getItem("zeroContextTheme");

    if (savedTheme === "light") {

        document.body.classList.add("light");
    }

    updateThemeButton();


    // Toggle theme

    themeButton.addEventListener("click", () => {

        document.body.classList.toggle("light");

        const theme =
            document.body.classList.contains("light")
                ? "light"
                : "dark";

        localStorage.setItem(
            "zeroContextTheme",
            theme
        );

        updateThemeButton();
    });


    /* =========================
       ALERT TELEMETRY
    ========================== */

    async function fetchAlerts() {

        try {

            const response =
                await fetch('/api/alerts', {
                    headers: { 'X-API-Key': ZC_API_KEY }
                });

            if (!response.ok) {
                console.error(
                    "Failed to fetch telemetry: HTTP",
                    response.status
                );
                return;
            }

            const alerts =
                await response.json();

            const tbody =
                document.getElementById(
                    'alert-table-body'
                );

            tbody.innerHTML = '';


            /* =====================
               STATISTICS
            ====================== */

            document.getElementById(
                "totalAlerts"
            ).textContent = alerts.length;


            const highRisk =
                alerts.filter(
                    alert => alert.anomaly_score > 0.1
                ).length;


            document.getElementById(
                "highRisk"
            ).textContent = highRisk;


            document.getElementById(
                "lastUpdate"
            ).textContent =
                new Date().toLocaleTimeString();


            /* =====================
               NO ALERTS
            ====================== */

            if (alerts.length === 0) {

                tbody.innerHTML = `
                    <tr>
                        <td colspan="5"
                            style="text-align:center;">
                            No threats detected
                        </td>
                    </tr>
                `;

                return;
            }


            /* =====================
               ALERT ROWS
            ====================== */

            alerts.forEach(alert => {

                const row =
                    document.createElement('tr');


                // Timestamp

                const date =
                    new Date(
                        alert.timestamp * 1000
                    );


                const timeString =
                    date.toLocaleTimeString() +
                    '.' +
                    String(
                        date.getMilliseconds()
                    ).padStart(3, '0');


                // Sensor

                const sensorClass =
                    alert.sensor_type ===
                    'MOUSE_KINEMATICS'
                        ? 'sensor-mouse'
                        : 'sensor-kbd';


                // Score

                const scoreClass =
                    alert.anomaly_score > 0.1
                        ? 'score-high'
                        : 'score-med';


                // Row

                row.innerHTML = `

                    <td>
                        <span class="badge">
                            #${alert.alert_id}
                        </span>
                    </td>

                    <td>
                        ${timeString}
                    </td>

                    <td class="${sensorClass}">
                        ${alert.sensor_type}
                    </td>

                    <td class="${scoreClass}">
                        ${Number(
                            alert.anomaly_score
                        ).toFixed(4)}
                    </td>

                    <td>
                        ${alert.description}
                    </td>

                `;


                tbody.appendChild(row);

            });


        } catch (error) {

            console.error(
                "Failed to fetch telemetry:",
                error
            );

        }

    }


    /* =========================
       AUTO REFRESH
    ========================== */

    setInterval(
        fetchAlerts,
        1500
    );

    fetchAlerts();

</script>

</body>
</html>
